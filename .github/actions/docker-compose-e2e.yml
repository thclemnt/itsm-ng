services:
  app:
    environment:
      GLPI_VAR_DIR: "${PLAYWRIGHT_VAR_DIR}"

  app-web:
    container_name: "app-web"
    image: "${PHP_IMAGE:-itsm-tests-app:local}"
    working_dir: "/var/itsm"
    command: ["php", "-S", "127.0.0.1:8088", "tests/router.php"]
    environment:
      GLPI_VAR_DIR: "${PLAYWRIGHT_VAR_DIR}"
      CODE_COVERAGE: "${CODE_COVERAGE:-false}"
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8088/index.php"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - "${APPLICATION_ROOT}:/var/itsm:z"
      - "${APP_CONTAINER_HOME}:/home/itsm:z"

  e2e:
    container_name: "e2e"
    build:
      context: "${APPLICATION_ROOT}"
      dockerfile: ".github/actions/images/e2e/Dockerfile"
    image: "${E2E_IMAGE:-itsm-tests-e2e:local}"
    working_dir: "/var/itsm"
    command: ["sleep", "infinity"]
    ipc: host
    network_mode: "service:app-web"
    environment:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8088
      PLAYWRIGHT_DOMAIN_CONFIG: /var/itsm/tests/config
      PLAYWRIGHT_APPLIANCE_CONFIG: /var/itsm/tests/config
      PLAYWRIGHT_TRANSFER_CONFIG: /var/itsm/tests/config
      PLAYWRIGHT_DROPDOWN_CONFIG: /var/itsm/tests/config
      PLAYWRIGHT_SESSION_CONFIG: /var/itsm/tests/config
    depends_on:
      - app-web
    volumes:
      - "${APPLICATION_ROOT}:/var/itsm:z"
      - /var/run/docker.sock:/var/run/docker.sock
