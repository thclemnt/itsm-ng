name: End-to-End Tests

on: [pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Playwright / PHP ${{ matrix.php }} / ${{ matrix.database.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
        database:
          - image: public.ecr.aws/docker/library/mariadb:11.8
            label: MariaDB 11.8
            id: mariadb-11.8
            provider: mysql
          - image: public.ecr.aws/docker/library/postgres:18
            label: PostgreSQL 18
            id: postgres-18
            provider: pgsql
    permissions:
      contents: read
    env:
      DB_IMAGE: ${{ matrix.database.image }}
      TEST_DB_TYPE: ${{ matrix.database.provider }}
      PHP_IMAGE: itsm-tests-app:local
      TEST_PHP_VERSION: ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v7

      - name: Run Playwright E2E tests
        run: ./tests/run_tests.sh --build e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-php-${{ matrix.php }}-${{ matrix.database.id }}
          path: tests/files/_playwright
