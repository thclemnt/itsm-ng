name: Web API Tests

on: [pull_request]

jobs:
  tests:
    name: Run web API tests
    runs-on: ubuntu-latest
    env:
      DB_DATABASE: test_db
      DB_USER: test
      DB_PASSWORD: test

    services:
      mariadb:
        image: mariadb:latest
        ports:
          - 3306:3306
        env:
          MYSQL_USER: ${{env.DB_USER}}
          MYSQL_PASSWORD: ${{env.DB_PASSWORD}}
          MYSQL_DATABASE: ${{env.DB_DATABASE}}
          MYSQL_ROOT_PASSWORD: ${{env.DB_PASSWORD}}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run composer install
        run: export NODE_OPTIONS=--openssl-legacy-provider && php bin/console dependencies install

      - name: Install ITSM-ng
        run: php bin/console itsmng:database:install --config-dir=${{ github.workspace }}/tests/config -H 127.0.0.1 -u $DB_USER -p $DB_PASSWORD -d $DB_DATABASE -n

      - name: Run web API tests
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, re, signal, subprocess, sys
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'web-api-server.log'
          result = 1
          cleanup_errors = []
          with log.open('w') as output:
              server = subprocess.Popen(['php', '-S', 'localhost:8088', 'tests/router.php'], stdout=output, stderr=subprocess.STDOUT)
              try:
                  result = subprocess.run([
                      'vendor/bin/atoum', '-p', 'php -d memory_limit=512M', '--debug',
                      '--force-terminal', '--use-dot-report', '--bootstrap-file', 'tests/bootstrap.php',
                      '--no-code-coverage', '--max-children-number', '1', '-d', 'tests/web',
                  ]).returncode
              finally:
                  running = server.poll() is None
                  if running:
                      server.terminate()
                  server_status = server.wait()
                  if not running or server_status != -signal.SIGTERM:
                      cleanup_errors.append(f'Owned server exited {server_status}')
                  output.flush()
                  diagnostics = re.sub(r'((?:GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS) )\S+', r'\1[request URI omitted]', log.read_text(errors='replace'))
                  log.with_name('web-api-server-diagnostics.log').write_text(diagnostics)
                  print(f'API tests exit={result}; owned server exit={server_status}; cleanup errors={cleanup_errors}', flush=True)
          sys.exit(result if result else bool(cleanup_errors))
          PYTHON

      - name: Retain PHP server diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-api-server-diagnostics
          path: ${{ runner.temp }}/web-api-server-diagnostics.log
          if-no-files-found: warn
