name: Web API Tests

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Web API / PHP ${{ matrix.php }} / ${{ matrix.database.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
        database:
          - image: public.ecr.aws/docker/library/mariadb:11.8
            label: MariaDB 11.8
            id: mariadb-11.8
            provider: mysql
            port: 3306
            health: mariadb-admin ping
          - image: public.ecr.aws/docker/library/postgres:18
            label: PostgreSQL 18
            id: postgres-18
            provider: pgsql
            port: 5432
            health: pg_isready -U test -d test_db
    env:
      DB_DATABASE: test_db
      DB_USER: test
      DB_PASSWORD: test

    services:
      database:
        image: ${{ matrix.database.image }}
        ports:
          - ${{ matrix.database.port }}:${{ matrix.database.port }}
        env:
          MYSQL_USER: ${{ env.DB_USER }}
          MYSQL_PASSWORD: ${{ env.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ env.DB_DATABASE }}
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
          POSTGRES_DB: ${{ env.DB_DATABASE }}
        options: >-
          --health-cmd "${{ matrix.database.health }}"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, pgsql, pdo_pgsql, dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, apcu, redis
          coverage: none

      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run composer install
        run: php bin/console dependencies install

      - name: Prepare database and install ITSM-ng
        uses: ./.github/actions/setup-test-database
        with:
          container: ${{ job.services.database.id }}
          provider: ${{ matrix.database.provider }}
          port: ${{ matrix.database.port }}

      - name: Run web API tests
        run: bash .github/actions/test_tests-web.sh

      - name: Retain PHP server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-api-server-diagnostics-php-${{ matrix.php }}-${{ matrix.database.id }}
          path: ${{ runner.temp }}/web-api-server-diagnostics.log
          if-no-files-found: warn
