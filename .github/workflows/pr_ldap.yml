name: LDAP Tests

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: LDAP / ${{ matrix.database.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database:
          - image: mariadb:11.8
            label: MariaDB 11.8
            id: mariadb-11.8
            provider: mysql
            port: 3306
            health: mariadb-admin ping
          - image: postgres:18
            label: PostgreSQL 18
            id: postgres-18
            provider: pgsql
            port: 5432
            health: pg_isready -U test -d test_db
    env:
      DB_DATABASE: test_db
      DB_USER: test
      DB_PASSWORD: test

    services:
      database:
        image: ${{ matrix.database.image }}
        ports:
          - ${{ matrix.database.port }}:${{ matrix.database.port }}
        env:
          MYSQL_USER: ${{ env.DB_USER }}
          MYSQL_PASSWORD: ${{ env.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ env.DB_DATABASE }}
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
          POSTGRES_DB: ${{ env.DB_DATABASE }}
        options: >-
          --health-cmd "${{ matrix.database.health }}"
          --health-interval 5s --health-timeout 5s --health-retries 20
      openldap:
        image: osixia/openldap:1.5.0
        ports:
          - 389:389
        env:
          LDAP_ORGANISATION: "GLPI"
          LDAP_DOMAIN: "glpi.org"
          LDAP_ADMIN_PASSWORD: "insecure"
          LDAP_CONFIG_PASSWORD: "insecure"

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mysqli, pdo_mysql, pgsql, pdo_pgsql, dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, ldap
          coverage: none

      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install ldap-utils
        run: sudo apt-get update && sudo apt-get install -y ldap-utils

      - name: Map openldap hostname to localhost
        run: echo "127.0.0.1 openldap" | sudo tee -a /etc/hosts

      - name: Run composer install
        run: export NODE_OPTIONS=--openssl-legacy-provider && php bin/console dependencies install

      - name: Prepare database and install ITSM-ng
        uses: ./.github/actions/setup-test-database
        with:
          container: ${{ job.services.database.id }}
          provider: ${{ matrix.database.provider }}
          port: ${{ matrix.database.port }}

      - name: Wait for OpenLDAP to be ready
        run: |
          ready=false
          for attempt in $(seq 1 30); do
            if ldapsearch -x -H ldap://localhost:389 -D "cn=admin,dc=glpi,dc=org" -w insecure -b "dc=glpi,dc=org" > /dev/null 2>&1; then ready=true; break; fi
            echo "Waiting for OpenLDAP..."
            sleep 2
          done
          test "$ready" = true

      - name: Load LDAP fixtures
        run: |
          for f in tests/LDAP/ldif/*.ldif; do
            awk '
              BEGIN { RS = ""; ORS = "\n\n"; }
              {
                dn = "";
                n = split($0, lines, "\n");
                for (i = 1; i <= n; i++) {
                  if (lines[i] ~ /^dn:[[:space:]]*/) { dn = lines[i]; break; }
                }
                if (dn != "dn: dc=glpi,dc=org" &&
                    dn != "dn: cn=admin,dc=glpi,dc=org" &&
                    dn != "dn: cn=admin, dc=glpi,dc=org") {
                  print $0;
                }
              }
            ' "$f" | ldapadd -x -H ldap://localhost:389 -D "cn=admin,dc=glpi,dc=org" -w insecure -c
          done

      - name: Run LDAP tests
        run: vendor/bin/atoum -p 'php -d memory_limit=512M' --debug --force-terminal --use-dot-report --bootstrap-file tests/bootstrap.php --fail-if-skipped-methods --no-code-coverage --max-children-number 1 -d tests/LDAP
