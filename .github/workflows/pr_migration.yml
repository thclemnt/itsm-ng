name: Test Migration

on: [pull_request]

jobs:
  tests:
    name: Run tests (${{ matrix.db.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          - image: mariadb:11.8
            label: MariaDB 11.8
            healthcheck: mariadb-admin ping
            client: mariadb
          - image: mysql:8.4
            label: MySQL 8.4
            healthcheck: mysqladmin ping
            client: mysql
    env:
      DB_DATABASE: itsm_port_migration
      DB_USER: itsm_migration
      DB_PASSWORD: itsm_migration
      PORT_HISTORY_DB: itsm_port_migration_history
      MIGRATION_CONFIG: /tmp/itsm-port-migration-config

    services:
      db:
        image: ${{ matrix.db.image }}
        ports:
          - 3306:3306
        env:
          MYSQL_USER: ${{env.DB_USER}}
          MYSQL_PASSWORD: ${{env.DB_PASSWORD}}
          MYSQL_DATABASE: ${{env.DB_DATABASE}}
          MYSQL_ROOT_PASSWORD: ${{env.DB_PASSWORD}}
        options: --health-cmd "${{ matrix.db.healthcheck }}" --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run composer / npm install
        run: export NODE_OPTIONS=--openssl-legacy-provider && php bin/console dependencies install

      - name: Install the disposable parent and its original encryption key
        run: |
          mkdir -m 700 "$MIGRATION_CONFIG"
          php bin/console db:install --config-dir="$MIGRATION_CONFIG" --db-host=127.0.0.1 --db-user="$DB_USER" --db-password="$DB_PASSWORD" --db-name="$DB_DATABASE" --no-interaction

      - name: Provision the separate populated-history fixture
        run: |
          docker exec "${{ job.services.db.id }}" ${{ matrix.db.client }} -uroot -p"$DB_PASSWORD" -e "CREATE DATABASE $PORT_HISTORY_DB CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL ON $PORT_HISTORY_DB.* TO '$DB_USER'@'%';"

      - name: Test populated frozen adoption, original-key preservation and retry
        run: timeout --signal=TERM --kill-after=10s 300s php tests/database-portability/migration-history.php "$MIGRATION_CONFIG"
