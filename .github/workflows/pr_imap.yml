name: IMAP Tests

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: IMAP / PHP ${{ matrix.php }} / ${{ matrix.database.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
        database:
          - image: mariadb:11.8
            label: MariaDB 11.8
            id: mariadb-11.8
            provider: mysql
            port: 3306
            health: mariadb-admin ping
          - image: postgres:18
            label: PostgreSQL 18
            id: postgres-18
            provider: pgsql
            port: 5432
            health: pg_isready -U test -d test_db
    env:
      DB_DATABASE: test_db
      DB_USER: test
      DB_PASSWORD: test

    services:
      database:
        image: ${{ matrix.database.image }}
        ports:
          - ${{ matrix.database.port }}:${{ matrix.database.port }}
        env:
          MYSQL_USER: ${{ env.DB_USER }}
          MYSQL_PASSWORD: ${{ env.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ env.DB_DATABASE }}
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
          POSTGRES_DB: ${{ env.DB_DATABASE }}
        options: >-
          --health-cmd "${{ matrix.database.health }}"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, pgsql, pdo_pgsql, dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, apcu, redis
          coverage: none

      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Build and start Dovecot container
        run: |
          docker build -t itsm-tests-dovecot:local -f .github/actions/images/dovecot/Dockerfile .
          docker run -d --name dovecot -p 143:143 -p 110:110 itsm-tests-dovecot:local

      - name: Map dovecot hostname to localhost
        run: echo "127.0.0.1 dovecot" | sudo tee -a /etc/hosts

      - name: Run composer install
        run: export NODE_OPTIONS=--openssl-legacy-provider && php bin/console dependencies install

      - name: Prepare database and install ITSM-ng
        uses: ./.github/actions/setup-test-database
        with:
          container: ${{ job.services.database.id }}
          provider: ${{ matrix.database.provider }}
          port: ${{ matrix.database.port }}

      - name: Load IMAP fixtures
        run: |
          docker exec dovecot doveadm expunge -u testuser mailbox 'INBOX' all || true
          docker exec dovecot doveadm purge -u testuser || true
          for f in tests/emails-tests/*.eml; do
            docker exec -i --user testuser dovecot getmail_maildir /home/testuser/Maildir/ < "$f"
          done

      - name: Run IMAP tests
        run: vendor/bin/atoum -p 'php -d memory_limit=512M' --debug --force-terminal --use-dot-report --bootstrap-file tests/bootstrap.php --fail-if-skipped-methods --no-code-coverage --max-children-number 1 -d tests/imap
